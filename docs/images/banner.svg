<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title description">
  <title id="title">SwooshDrop — a little air, through Windows.</title>
  <desc id="description">The coral Through icon beside SwooshDrop's wordmark on a charcoal background. An unofficial hardware beta for receiving iPhone AirDrop files on Windows.</desc>
