    <g id="through" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 13 L20 13 C15 13 12 17 12 22 L12 42 C12 48 16 52 22 52 L42 52 C48 52 52 48 52 42 L52 31"/>
      <path d="M23 22 C26 30 31 36 43 42"/>
      <path d="M31 43 L45 43 L45 29"/>
    </g>
  </defs>
  <rect width="1280" height="320" rx="28" fill="#17191C"/>
  <path d="M790 0 C960 180 1060 10 1280 165" stroke="#363A41" stroke-width="1" fill="none"/>
  <path d="M820 320 C930 130 1120 280 1280 90" stroke="#363A41" stroke-width="1" fill="none"/>
  <use href="#through" transform="translate(920 -48) scale(6.3)" stroke="#F39485" opacity="0.1"/>
  <rect x="64" y="88" width="116" height="116" rx="29" fill="#F39485"/>
