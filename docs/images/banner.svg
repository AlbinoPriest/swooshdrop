  <text x="210" y="157" font-family="Georgia,serif" font-size="62" fill="#F1EDE8">SwooshDrop</text>
  <text x="214" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#B2B0B0">A little air, through Windows.</text>
  <rect x="214" y="235" width="149" height="30" rx="15" fill="#292D33"/>
